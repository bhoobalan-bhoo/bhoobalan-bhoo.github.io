<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // Redirect to bhoobalan.in preserving the current path + query + hash
      const destination =
        "https://www.bhoobalan.in" +
        window.location.pathname +
        window.location.search +
        window.location.hash;
      window.location.replace(destination);
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0; url=https://www.bhoobalan.in" />
    </noscript>
  </head>
  <body>
    <p>Redirecting to <a href="https://www.bhoobalan.in">bhoobalan.in</a>...</p>
  </body>
</html>
